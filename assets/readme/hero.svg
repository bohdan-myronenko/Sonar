<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="380" viewBox="0 0 1200 380"
     role="img" aria-labelledby="title desc">
  <title id="title">Sonar — self-contained Linux music player</title>
  <desc id="desc">A modern desktop music player with MPRIS integration, built on JavaFX and libmpv. Ships with its own runtime — no Java install needed.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="100%" stop-color="#121830"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff"/>
      <stop offset="100%" stop-color="#7bb3ff"/>
    </linearGradient>
    <linearGradient id="pulse1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="pulse2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0.0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="1200" height="380" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1200" height="380" fill="url(#bg)"/>

    <!-- Sonar pulse rings -->
    <g transform="translate(900 190)">
      <circle cx="0" cy="0" r="320" fill="url(#pulse1)"/>
      <circle cx="0" cy="0" r="220" fill="url(#pulse2)"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#4f8cff" stroke-width="1.2" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="120" fill="none" stroke="#4f8cff" stroke-width="0.6" stroke-opacity="0.12" transform="scale(0.7)"/>
      <circle cx="0" cy="0" r="3" fill="#4f8cff" fill-opacity="0.6"/>
    </g>

    <!-- Player visual: simplified album art + controls area -->
    <g transform="translate(830 82)">
      <!-- Album card -->
      <rect x="0" y="0" width="190" height="190" rx="12" fill="#1a2040" stroke="#2a3058" stroke-width="1"/>
      <!-- Inner disc hint -->
      <circle cx="95" cy="95" r="42" fill="none" stroke="#3a4070" stroke-width="1" stroke-opacity="0.5"/>
      <circle cx="95" cy="95" r="28" fill="none" stroke="#4f8cff" stroke-width="1" stroke-opacity="0.3"/>
      <circle cx="95" cy="95" r="6" fill="#4a4f6a" fill-opacity="0.6"/>
      <!-- Waveform bars on cover -->
      <rect x="62" y="90" width="4" height="16" rx="2" fill="#4f8cff" fill-opacity="0.4"/>
      <rect x="70" y="82" width="4" height="24" rx="2" fill="#4f8cff" fill-opacity="0.5"/>
      <rect x="78" y="78" width="4" height="28" rx="2" fill="#4f8cff" fill-opacity="0.6"/>
      <rect x="86" y="85" width="4" height="22" rx="2" fill="#4f8cff" fill-opacity="0.55"/>
      <rect x="94" y="74" width="4" height="32" rx="2" fill="#4f8cff" fill-opacity="0.65"/>
      <rect x="102" y="80" width="4" height="26" rx="2" fill="#4f8cff" fill-opacity="0.5"/>
      <rect x="110" y="86" width="4" height="20" rx="2" fill="#4f8cff" fill-opacity="0.45"/>
      <rect x="118" y="92" width="4" height="14" rx="2" fill="#4f8cff" fill-opacity="0.35"/>

      <!-- Track info text -->
      <text x="95" y="160" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#c8d0e8">Current Track</text>
      <text x="95" y="177" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" fill="#68709a">Artist Name</text>
    </g>

    <!-- Playback controls row -->
    <g transform="translate(838 287)">
      <rect x="0" y="0" width="174" height="30" rx="7" fill="#161e38"/>
      <!-- prev -->
      <polygon points="28,8 28,22 22,15" fill="#7a80a8"/>
      <polygon points="28,8 28,22 34,15" fill="#7a80a8"/>
      <!-- play icon -->
      <polygon points="70,8 70,22 86,15" fill="#4f8cff" fill-opacity="0.85"/>
      <!-- next -->
      <polygon points="126,8 126,22 120,15" fill="#7a80a8"/>
      <polygon points="126,8 126,22 132,15" fill="#7a80a8"/>
      <!-- shuffle -->
      <g transform="translate(160 8)">
        <path d="M6 7 L10 3 L14 7 M10 3 L10 9" fill="none" stroke="#7a80a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M0 12 L6 16 L0 20" fill="none" stroke="#7a80a8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- Seek bar -->
    <rect x="838" y="325" width="174" height="3" rx="1.5" fill="#202848"/>
    <rect x="838" y="325" width="78" height="3" rx="1.5" fill="url(#accent)" fill-opacity="0.7"/>

    <!-- Title area -->
    <g transform="translate(64 74)">
      <!-- Category chip -->
      <rect x="0" y="0" width="86" height="26" rx="13" fill="#1a2550" stroke="#2e3a6a" stroke-width="1"/>
      <text x="43" y="18" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="500" fill="#5b7ad0">Music Player</text>

      <!-- Name -->
      <text x="0" y="90" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="72" font-weight="700" fill="#e8ecff" letter-spacing="-1.5">Sonar</text>

      <!-- Tagline -->
      <text x="0" y="138" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#8a90b8">
        A self-contained Linux music player.
      </text>
      <text x="0" y="166" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="400" fill="#8a90b8">
        No Java install needed. Full MPRIS control.
      </text>

      <!-- Feature badges -->
      <g transform="translate(0 210)">
        <!-- mpv badge -->
        <rect x="0" y="0" width="52" height="22" rx="11" fill="#1a2040" stroke="#2e3a5a" stroke-width="1"/>
        <text x="26" y="14.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#6080cc">mpv</text>

        <!-- MPRIS badge -->
        <rect x="62" y="0" width="62" height="22" rx="11" fill="#1a2040" stroke="#2e3a5a" stroke-width="1"/>
        <text x="93" y="14.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#6080cc">MPRIS</text>

        <!-- Formats badge -->
        <rect x="134" y="0" width="86" height="22" rx="11" fill="#1a2040" stroke="#2e3a5a" stroke-width="1"/>
        <text x="177" y="14.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="500" fill="#6080cc">25+ Formats</text>
      </g>
    </g>
  </g>
</svg>
