<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="140" viewBox="0 0 1200 140"
     role="img" aria-labelledby="title">
  <title id="title">Showcase</title>

  <defs>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4f8cff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4f8cff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4f8cff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="140" fill="transparent"/>

  <!-- Top rule -->
  <rect x="300" y="0" width="600" height="1" rx="0.5" fill="url(#rule)"/>

  <!-- Section title -->
  <text x="600" y="70" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
        font-size="36" font-weight="700" fill="#c8d0e8" letter-spacing="-0.5">Showcase</text>

  <!-- Bottom rule -->
  <rect x="300" y="139" width="600" height="1" rx="0.5" fill="url(#rule)"/>
</svg>
