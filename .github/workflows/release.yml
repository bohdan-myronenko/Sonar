name: Release

# Tag push builds and publishes a draft release.
# workflow_dispatch builds both platforms and uploads artifacts only, so you
# can smoke-test a release candidate without creating a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true
        default: '1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

  linux:
    name: Linux (x86_64)
    needs: version
    # Deliberately NOT ubuntu-latest. The jlink runtime and sonar_mpris_d link
    # against the runner's glibc, so this pins the minimum glibc users need
    # (22.04 => 2.35). Bumping this silently drops support for older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # This is the JDK that gets jlinked into the shipped runtime, so it is
      # the JVM users actually run. 25 is the current LTS. The code itself
      # still targets 21 via maven.compiler.release, so it stays buildable on
      # older JDKs; 24+ only matters because that is where JEP 472 starts
      # enforcing --enable-native-access.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # libmpv is intentionally absent: JNA resolves it at runtime on the
      # user's machine, so nothing links against it at build time. Only the
      # MPRIS C daemon needs headers, and it only needs D-Bus.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./package.sh

      # `bin/java -version` doubles as a check that the options baked in by
      # jlink --add-options are valid: an unrecognised one would abort here.
      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          target/sonar-jlink/bin/java -version
          target/sonar-jlink/bin/java --list-modules | grep -q '^folltrace.sonar'
          test -x target/sonar_mpris_d
          tar tzf "target/sonar-${VERSION}-linux.tar.gz" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-linux
          path: target/sonar-*-linux.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # package.ps1 downloads pinned, checksum-verified LGPL builds of libmpv
      # and ffmpeg and bundles them, because Windows has neither as a system
      # component. Signing is skipped automatically when the secrets are
      # absent, so forks and dispatch runs still produce a usable package.
      - name: Package
        shell: pwsh
        env:
          SONAR_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SONAR_SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: .\package.ps1 -Version ${{ needs.version.outputs.version }}

      # `java.exe -version` doubles as a check that the options baked in by
      # jlink --add-options are valid: an unrecognised one would abort here.
      - name: Smoke test
        shell: pwsh
        run: |
          & target\sonar-jlink\bin\java.exe -version
          $mods = & target\sonar-jlink\bin\java.exe --list-modules
          Write-Host '--- jlink module list ---'
          $mods
          if ($mods -notmatch 'folltrace\.sonar') {
            Write-Host "--- module-info.class exists? ---"
            Test-Path 'target\classes\module-info.class'
            Write-Host '--- top-level files under target/classes ---'
            Get-ChildItem target\classes -Recurse -File -Name | Select-Object -First 40
            Write-Host '---' 
            Get-ChildItem target\genmods -Recurse -File -Name | Select-Object -First 20
            Write-Host '--- jlink output image contents ---'
            Get-ChildItem target\sonar-jlink\lib -Recurse -File -Name | Select-Object -First 30
            throw 'folltrace.sonar not linked into runtime'
          }
          foreach ($p in 'target\jpackage\Sonar\Sonar.exe',
                         'target\jpackage\Sonar\app\libmpv-2.dll',
                         'target\jpackage\Sonar\app\ffmpeg\ffmpeg.exe',
                         'target\jpackage\Sonar\app\ffmpeg\ffprobe.exe',
                         'target\jpackage\Sonar\licenses\mpv\LGPL-2.1.txt',
                         'target\jpackage\Sonar\licenses\ffmpeg\LGPL-2.1.txt') {
            if (-not (Test-Path $p)) { throw "missing: $p" }
          }
          # The bundled ffprobe must actually run: a missing shared library
          # would otherwise only surface for users, as a silent fallback to
          # "Unknown" durations.
          $v = & target\jpackage\Sonar\app\ffmpeg\ffprobe.exe -version 2>&1 | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "bundled ffprobe failed to run: $v" }
          Write-Host "bundled $v"

      - name: Report signing status
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature 'target\jpackage\Sonar\Sonar.exe'
          Write-Host "Sonar.exe signature status: $($sig.Status)"
          if ($sig.Status -eq 'Valid') { Write-Host "Signed by: $($sig.SignerCertificate.Subject)" }

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-windows
          path: target/sonar-*-windows-x64.zip
          if-no-files-found: error

  release:
    name: Draft release
    # Tag pushes only: a manual dispatch should never create a tag or release.
    if: github.event_name == 'push'
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Promoted to job level so the step-level `if` below can test it.
      # The secrets context is not reliably available in a step `if`.
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The Linux tarball has no equivalent of Authenticode, so the checksum
      # file is GPG-signed instead: verifying SHA256SUMS.asc then transitively
      # authenticates every artifact listed in it. Skipped when unconfigured.
      - name: Sign checksums
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor \
              --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*
