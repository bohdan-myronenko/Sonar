name: Release

# Tag push builds and publishes a draft release.
# workflow_dispatch builds both platforms and uploads artifacts only, so you
# can smoke-test a release candidate without creating a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true
        default: '1.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building version ${version}"

  linux:
    name: Linux (x86_64)
    needs: version
    # Deliberately NOT ubuntu-latest. The jlink runtime and sonar_mpris_d link
    # against the runner's glibc, so this pins the minimum glibc users need
    # (22.04 => 2.35). Bumping this silently drops support for older distros.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      # This is the JDK that gets jlinked into the shipped runtime, so it is
      # the JVM users actually run. 25 is the current LTS. The code itself
      # still targets 21 via maven.compiler.release, so it stays buildable on
      # older JDKs; 24+ only matters because that is where JEP 472 starts
      # enforcing --enable-native-access.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # libmpv is intentionally absent: JNA resolves it at runtime on the
      # user's machine, so nothing links against it at build time. Only the
      # MPRIS C daemon needs headers, and it only needs D-Bus.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./package.sh

      # `bin/java -version` doubles as a check that the options baked in by
      # jlink --add-options are valid: an unrecognised one would abort here.
      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          target/sonar-jlink/bin/java -version
          target/sonar-jlink/bin/java --list-modules | grep -q '^folltrace.sonar'
          test -x target/sonar_mpris_d
          tar tzf "target/sonar-${VERSION}-linux.tar.gz" >/dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-linux
          path: |
            target/sonar-${{ needs.version.outputs.version }}-linux.tar.gz
          if-no-files-found: error

  windows:
    name: Windows (x64)
    needs: version
    # package-win.sh cross-builds the whole Windows package from Linux: it
    # downloads a stock Adoptium Windows JRE and JavaFX's -win jars, then
    # wraps everything with a Linux build of launch4j. No Windows runner,
    # jlink, or jpackage is involved, and there is no code signing to do.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 7z is needed to unpack the libmpv archive and to zip the final
      # package; everything else package-win.sh needs (curl, unzip, tar,
      # sha256sum, awk, find) is already on ubuntu-latest.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full

      # Speeds up re-runs: the JRE, launch4j, JavaFX -win jars, libmpv and
      # ffmpeg are all downloaded into .cache/ and content-verified there.
      - name: Cache downloaded Windows build assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: package-win-cache-${{ hashFiles('package-win.sh') }}

      - name: Package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: ./package-win.sh

      # The produced binaries are for Windows and can't run on this Linux
      # runner, so this only checks the zip's layout. package-win.sh's own
      # Step 5 already verifies the unpacked tree before it gets this far.
      - name: Smoke test
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          OUTPUT="target/sonar-${VERSION}-windows-x64.zip"
          test -f "$OUTPUT"
          LISTING="$(unzip -l "$OUTPUT")"
          for entry in Sonar.exe Sonar-debug.bat jre/bin/java.exe jre/bin/javaw.exe \
                       app/sonar.jar app/native/libmpv-2.dll app/ffmpeg/ffmpeg.exe \
                       app/ffmpeg/ffprobe.exe licenses/mpv/LGPL-2.1.txt licenses/ffmpeg/LGPL-2.1.txt; do
            echo "$LISTING" | grep -q "$entry" || { echo "ERROR: $entry missing from $OUTPUT"; exit 1; }
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sonar-windows
          path: |
            target/sonar-${{ needs.version.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  release:
    name: Draft release
    # Tag pushes only: a manual dispatch should never create a tag or release.
    if: github.event_name == 'push'
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Promoted to job level so the step-level `if` below can test it.
      # The secrets context is not reliably available in a step `if`.
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # The Linux tarball has no equivalent of Authenticode, so the checksum
      # file is GPG-signed instead: verifying SHA256SUMS.asc then transitively
      # authenticates every artifact listed in it. Skipped when unconfigured.
      - name: Sign checksums
        if: env.GPG_PRIVATE_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback \
              --passphrase "$GPG_PASSPHRASE" \
              --detach-sign --armor \
              --output dist/SHA256SUMS.asc dist/SHA256SUMS
          gpg --verify dist/SHA256SUMS.asc dist/SHA256SUMS

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: dist/*
